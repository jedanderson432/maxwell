name: health

on:
  schedule:
    - cron: "43 7 * * 1" # weekly, Monday
  workflow_dispatch: {}

permissions:
  contents: write   # heartbeat commit to state/
  issues: write

# Share the state/ lock with ingest so the two never race on a push.
concurrency:
  group: maxwell-state
  cancel-in-progress: false

jobs:
  health:
    # Kill switch: repository variable MAXWELL_ENABLED (constitution: Safety rails).
    if: ${{ vars.MAXWELL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      MAXWELL_ENABLED: ${{ vars.MAXWELL_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run health checks
        run: python -m src.lib.health

      - name: Run tests
        run: python -m pytest -q

      # Heartbeat: proof of life. Before this, a silent repo meant either
      # "healthy" or "dead" and there was no way to tell them apart. The dated
      # commit makes a stopped scheduler visible on the commit graph alone.
      - name: Commit heartbeat
        if: always()
        run: |
          git config user.name "maxwell[bot]"
          git config user.email "maxwell-bot@users.noreply.github.com"
          if [ ! -f state/health.json ]; then
            echo "No heartbeat written (health aborted before writing); nothing to commit."
            exit 0
          fi
          git add state/health.json
          if ! git diff --cached --quiet; then
            git commit -m "health: heartbeat $(date -u +%F)"
            git pull --rebase origin main
            git push
          else
            echo "Heartbeat unchanged."
          fi

      - name: Failure notification (failure-only Issues)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="MAXWELL failure: health $(date -u +%F)"
          body="Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "MAXWELL failure: health" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label maxwell-failure || gh issue create --title "$title" --body "$body"
          fi

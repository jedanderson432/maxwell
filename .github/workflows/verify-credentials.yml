name: verify-credentials

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    if: ${{ vars.MAXWELL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      MAXWELL_ENABLED: ${{ vars.MAXWELL_ENABLED }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ZENODO_SANDBOX_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
      IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
      IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify credentials (identity calls only; values never printed)
        run: python -m src.lib.verify_credentials
